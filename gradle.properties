# Done to increase the memory available to gradle.
# preferIPv4Stack avoids slow IPv6 fallback when downloading Minecraft artifacts,
# and the longer timeouts stop Loom's downloads from being cut off mid-transfer.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=60000
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.1.0
group=com.cute.aurorite

# Dependencies
fabric_api_version=0.166.2+26.3
